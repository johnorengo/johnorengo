  <text x="62" y="161" fill="#F1F5F9" font-family="Segoe UI,Arial,sans-serif" font-size="68" font-weight="700" letter-spacing="-3">John Orengo<tspan fill="#6EE7B7">.</tspan></text>
  <text x="66" y="226" fill="url(#accent)" font-family="Segoe UI,Arial,sans-serif" font-size="34" font-weight="600" letter-spacing="-1">Build with purpose.</text>
  <text x="66" y="272" fill="#F1F5F9" font-family="Segoe UI,Arial,sans-serif" font-size="34" font-weight="600" letter-spacing="-1">Secure by design.</text>
  <text x="66" y="322" fill="#9EB3C7" font-family="Segoe UI,Arial,sans-serif" font-size="17">Practical software. Resilient systems. Continuous learning.</text>
  <rect x="66" y="373" width="302" height="32" rx="16" fill="#6EE7B7" fill-opacity=".08" stroke="#6EE7B7" stroke-opacity=".23"/>
  <circle cx="85" cy="389" r="4" fill="#6EE7B7"/>
  <text x="99" y="394" fill="#B9EBD8" font-family="Segoe UI,Arial,sans-serif" font-size="12" letter-spacing="1">FULL STACK · SECURITY · CLOUD</text>
